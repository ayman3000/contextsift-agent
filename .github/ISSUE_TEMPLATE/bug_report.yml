name: Bug report
description: Report a reproducible ContextSift defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, private prompts, proprietary source code, or raw runtime artifacts. Use the security process for permission-boundary or command-execution findings.
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: Commit SHA or package version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Python, Ollama, and model versions
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use sanitized inputs and include the exact command.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed secrets, personal paths, and private data.
          required: true
        - label: This report is not a vulnerability requiring private disclosure.
          required: true
